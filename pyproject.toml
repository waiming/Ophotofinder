[project]
name = "Ophotofinder"
version = "0.1.0"
description = "Local RAG over your own photo folders: CLIP + local VLM captions + OCR/EXIF, all offline."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
  "chromadb>=0.5",
  "pillow>=10.0",
  "pillow-heif>=0.16",
  "pytesseract>=0.3.10",
  "flask>=3.0",
  "requests>=2.31",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Apple Vision second text reader (macOS): far better on real-world photos and
# reads Chinese/Japanese/Korean, which Tesseract cannot without language packs.
macos = [
  "pyobjc-framework-Vision>=10.0",
  "pyobjc-framework-Quartz>=10.0",
]
# Cross-platform second text reader (Linux, Windows, macOS). Models ship in the
# wheel, so it works offline with no download.
ocr = [
  "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
ophotofinder = "ophotofinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ophotofinder"]

[tool.setuptools.package-data]
ophotofinder = ["templates/*.html", "static/*"]
